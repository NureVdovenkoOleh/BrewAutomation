version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: brewdb
    ports:
      - "5432:5432"

  backend:
    build: .  
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=brewdb;Username=myuser;Password=mypassword
    depends_on:
      - db

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:80" 
    depends_on:
      - backend